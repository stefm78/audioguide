name: Proven Vendée production render

on:
  push:
    branches: [main]
    paths:
      - '.actions-smoke-trigger'
      - '.github/workflows/actions-smoke.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: proven-vendee-production-render
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Record start
        run: |
          mkdir -p audio/guides/vendee-revolution-ep01
          printf 'phase=started\nsource_commit=%s\n' "${{ github.sha }}" > audio/guides/vendee-revolution-ep01/proven-status.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/guides/vendee-revolution-ep01/proven-status.txt
          git commit -m 'Record Vendée render start' || true
          git push || true

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        id: install
        continue-on-error: true
        run: |
          mkdir -p audio/guides/vendee-revolution-ep01
          : > audio/guides/vendee-revolution-ep01/install.log
          pip_rc=0
          timeout 240s python -m pip install --disable-pip-version-check \
            'edge-tts==7.2.8' 'imageio-ffmpeg==0.6.0' \
            >> audio/guides/vendee-revolution-ep01/install.log 2>&1 || pip_rc=$?
          printf '\npip_rc=%s\n' "$pip_rc" >> audio/guides/vendee-revolution-ep01/install.log
          test "$pip_rc" -eq 0

      - name: Render Vendée episode 1
        id: render
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: |
          timeout 300s python scripts/render_audioguide.py scripts/guides/vendee-revolution-ep01.json > audio/guides/vendee-revolution-ep01/render.log 2>&1

      - name: Commit rendered episode and final diagnostic
        if: always()
        run: |
          mkdir -p audio/guides/vendee-revolution-ep01
          printf 'phase=finished\nsource_commit=%s\ninstall=%s\nrender=%s\n' \
            "${{ github.sha }}" \
            "${{ steps.install.outcome }}" \
            "${{ steps.render.outcome }}" > audio/guides/vendee-revolution-ep01/proven-status.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/guides/vendee-revolution-ep01/
          git commit -m 'Render Vendée Revolution episode 1 through proven path' || exit 0
          git push

      - name: Fail if production failed
        if: steps.install.outcome != 'success' || steps.render.outcome != 'success'
        run: exit 1
