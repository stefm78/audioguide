name: Final Vendée series render

on:
  push:
    branches: [main]
    paths:
      - '.actions-smoke-trigger'
      - '.github/workflows/actions-smoke.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: final-vendee-series-render
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Record final batch start
        run: |
          mkdir -p audio/guides
          printf 'phase=started\nsource_commit=%s\nepisodes=01,02,03,04,05,06,07\n' "${{ github.sha }}" > audio/guides/vendee-series-final-status.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/guides/vendee-series-final-status.txt
          git commit -m 'Record final Vendée series render start' || true
          git push || true

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install self-contained dependencies
        id: install
        continue-on-error: true
        run: |
          timeout 240s python -m pip install --disable-pip-version-check \
            'edge-tts==7.2.8' 'imageio-ffmpeg==0.6.0'

      - name: Render final episodes 1 through 7
        id: render
        if: steps.install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          overall=0
          for n in 01 02 03 04 05 06 07; do
            id="vendee-revolution-ep${n}"
            dir="audio/guides/${id}"
            mkdir -p "$dir"
            echo "=== Rendering final ${id} ==="
            timeout 420s python scripts/render_audioguide.py "scripts/guides/final/${id}.json" > "$dir/render.log" 2>&1
            rc=$?
            printf 'source_commit=%s\nproduction=final-v2\nrender_rc=%s\n' "${{ github.sha }}" "$rc" > "$dir/production-status.txt"
            cat "$dir/render.log"
            if [ "$rc" -ne 0 ]; then overall=1; fi
          done
          exit "$overall"

      - name: Record final status and commit audio
        if: always()
        run: |
          printf 'phase=finished\nsource_commit=%s\ninstall=%s\nrender=%s\nepisodes=01,02,03,04,05,06,07\n' \
            "${{ github.sha }}" \
            "${{ steps.install.outcome }}" \
            "${{ steps.render.outcome }}" > audio/guides/vendee-series-final-status.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/guides/vendee-series-final-status.txt \
            audio/guides/vendee-revolution-ep01/ \
            audio/guides/vendee-revolution-ep02/ \
            audio/guides/vendee-revolution-ep03/ \
            audio/guides/vendee-revolution-ep04/ \
            audio/guides/vendee-revolution-ep05/ \
            audio/guides/vendee-revolution-ep06/ \
            audio/guides/vendee-revolution-ep07/
          git commit -m 'Render final Vendée Revolution series' || exit 0
          git push

      - name: Fail if final render failed
        if: steps.install.outcome != 'success' || steps.render.outcome != 'success'
        run: exit 1
