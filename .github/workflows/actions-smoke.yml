name: Actions smoke test

on:
  push:
    branches: [main]
    paths:
      - '.actions-smoke-trigger'
      - '.github/workflows/actions-smoke.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Record smoke success
        run: |
          printf 'source_commit=%s\n' "${{ github.sha }}" > .actions-smoke-result
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .actions-smoke-result
          git commit -m 'Record Actions smoke success' || exit 0
          git push
