name: Generate Jeanne to Chinon audio

on:
  pull_request:
    paths:
      - 'series/jeanne-vers-le-roi/episodes/**'
      - 'scripts/voice-palette.json'
      - 'scripts/render_audioguide.py'
      - 'scripts/render_audioguide_fr.py'
      - '.github/workflows/generate-jeanne-vers-le-roi.yml'
  push:
    branches: [main]
    paths:
      - 'series/jeanne-vers-le-roi/episodes/**'
      - 'scripts/voice-palette.json'
      - 'scripts/render_audioguide.py'
      - 'scripts/render_audioguide_fr.py'
      - '.github/workflows/generate-jeanne-vers-le-roi.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jeanne-vers-le-roi-audio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install audio dependencies
        run: python -m pip install --disable-pip-version-check 'edge-tts==7.2.8' 'imageio-ffmpeg==0.6.0'
      - name: Render long French dramatization
        shell: bash
        run: |
          set -euo pipefail
          guide='series/jeanne-vers-le-roi/episodes/jeanne-vers-le-roi-ep01.json'
          test -s "$guide"
          timeout 1500s python scripts/render_audioguide_fr.py "$guide" > render.log 2>&1
          cat render.log
          out='audio/guides/jeanne-vers-le-roi-ep01'
          test -s "$out/guide.mp3"
          test -s "$out/resolved-cast.json"
          python - "$out/resolved-cast.json" <<'PY2'
          import json,pathlib,sys
          data=json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))
          assert data['segments']
          assert len(data['segments']) >= 50
          speakers={s.get('speaker') for s in data['segments']}
          assert len(speakers) >= 7, speakers
          for segment in data['segments']:
              assert 'fr-FR' in segment['voice'], segment['voice']
              assert segment['text'].strip()
          print('French multi-character validation:', len(data['segments']), 'segments /', len(speakers), 'speakers')
          PY2
          cp render.log "$out/render.log"
          mkdir -p bundle/jeanne-vers-le-roi-ep01
          cp "$out/guide.mp3" "$out/resolved-cast.json" "$out/render.log" bundle/jeanne-vers-le-roi-ep01/
      - uses: actions/upload-artifact@v4
        with:
          name: jeanne-vers-le-roi-ep01
          path: bundle/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: render
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - run: git pull --rebase origin main
      - uses: actions/download-artifact@v4
        with:
          name: jeanne-vers-le-roi-ep01
          path: audio/guides
      - name: Validate and publish
        shell: bash
        run: |
          set -euo pipefail
          out='audio/guides/jeanne-vers-le-roi-ep01'
          test -s "$out/guide.mp3"
          test -s "$out/resolved-cast.json"
          grep -q '"voice": "fr-FR-' "$out/resolved-cast.json"
          printf 'render=success\nmp3_count=1\nlocale_guard=fr-FR\nsource_commit=%s\n' "${{ github.sha }}" > audio/guides/jeanne-vers-le-roi-status.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$out" audio/guides/jeanne-vers-le-roi-status.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Generate Jeanne to Chinon audio'
            git push
          fi
