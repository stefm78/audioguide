name: Generate Vendée historical series

# Production workflow for historically reviewed episodes.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/guides/vendee-revolution-*.json'
      - 'scripts/voice-palette.json'
      - 'scripts/render_audioguide.py'
      - '.github/workflows/generate-vendee-series.yml'

permissions:
  contents: write

concurrency:
  group: vendee-historical-series
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install self-contained audio dependencies
        id: install
        run: |
          python -m pip install --disable-pip-version-check \
            'edge-tts==7.2.8' 'imageio-ffmpeg==0.6.0'

      - name: Render episode 1
        id: render
        run: |
          timeout 300s python scripts/render_audioguide.py scripts/guides/vendee-revolution-ep01.json \
            > /tmp/vendee-render.log 2>&1
          cat /tmp/vendee-render.log

      - name: Commit audio and production status
        if: always()
        run: |
          mkdir -p audio/guides/vendee-revolution-ep01
          printf 'source_commit=%s\ninstall=%s\nrender=%s\n' \
            "${{ github.sha }}" \
            "${{ steps.install.outcome }}" \
            "${{ steps.render.outcome }}" \
            > audio/guides/vendee-revolution-ep01/production-status.txt
          if [ -f /tmp/vendee-render.log ]; then
            cp /tmp/vendee-render.log audio/guides/vendee-revolution-ep01/render.log
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/guides/vendee-revolution-ep01/
          git commit -m 'Render Vendée Revolution episode 1' || exit 0
          git push

      - name: Fail if render failed
        if: steps.install.outcome != 'success' || steps.render.outcome != 'success'
        run: exit 1
