name: Generate Orleans cathedral audio

on:
  pull_request:
    paths:
      - 'series/orleans-cathedral/**'
      - 'scripts/voice-palette.json'
      - 'scripts/render_audioguide.py'
      - 'scripts/render_audioguide_fr.py'
      - '.github/workflows/generate-orleans-cathedral.yml'
  push:
    branches: [main]
    paths:
      - 'series/orleans-cathedral/**'
      - 'scripts/voice-palette.json'
      - 'scripts/render_audioguide.py'
      - 'scripts/render_audioguide_fr.py'
      - '.github/workflows/generate-orleans-cathedral.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: orleans-cathedral-audio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        guide:
          - orleans-cathedral-ep01
          - orleans-cathedral-ep02
          - orleans-cathedral-ep03
          - orleans-cathedral-ep04
          - orleans-cathedral-ep05
          - orleans-cathedral-ep06
          - orleans-cathedral-ep07
          - orleans-cathedral-ep08
          - orleans-cathedral-g01
          - orleans-cathedral-g02
          - orleans-cathedral-g03
          - orleans-cathedral-g04
          - orleans-cathedral-g05
          - orleans-cathedral-g06
          - orleans-cathedral-g07
          - orleans-cathedral-g08
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install audio dependencies
        run: python -m pip install --disable-pip-version-check 'edge-tts==7.2.8' 'imageio-ffmpeg==0.6.0'
      - name: Render guide in French
        shell: bash
        run: |
          set -euo pipefail
          guide="series/orleans-cathedral/episodes/${{ matrix.guide }}.json"
          test -s "$guide"
          timeout 780s python scripts/render_audioguide_fr.py "$guide" > render.log 2>&1
          cat render.log
          out="audio/guides/${{ matrix.guide }}"
          test -s "$out/guide.mp3"
          test -s "$out/resolved-cast.json"
          python - "$out/resolved-cast.json" <<'PY2'
          import json,pathlib,sys
          data=json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))
          assert data['segments']
          for segment in data['segments']:
              assert 'fr-FR' in segment['voice'], segment['voice']
              assert segment['text'].strip()
          PY2
          cp render.log "$out/render.log"
          mkdir -p "bundle/${{ matrix.guide }}"
          cp "$out/guide.mp3" "$out/resolved-cast.json" "$out/render.log" "bundle/${{ matrix.guide }}/"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.guide }}
          path: bundle/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: render
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - run: git pull --rebase origin main
      - uses: actions/download-artifact@v4
        with:
          pattern: orleans-cathedral-*
          path: audio/guides
          merge-multiple: true
      - name: Validate and publish
        shell: bash
        run: |
          set -euo pipefail
          mp3_count=$(find audio/guides -maxdepth 2 -type f -path '*/orleans-cathedral-*/guide.mp3' | wc -l | tr -d ' ')
          manifest_count=$(find audio/guides -maxdepth 2 -type f -path '*/orleans-cathedral-*/resolved-cast.json' | wc -l | tr -d ' ')
          french_count=$(grep -RIl '"voice": "fr-FR-' audio/guides/orleans-cathedral-*/resolved-cast.json | wc -l | tr -d ' ')
          test "$mp3_count" = "16"
          test "$manifest_count" = "16"
          test "$french_count" = "16"
          printf 'source_commit=%s\nrender=success\nmp3_count=%s\nmanifest_count=%s\nfrench_manifest_count=%s\nlocale_guard=fr-FR\n' "${{ github.sha }}" "$mp3_count" "$manifest_count" "$french_count" > audio/guides/orleans-cathedral-status.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/guides/orleans-cathedral-status.txt
          for dir in audio/guides/orleans-cathedral-*; do [ -e "$dir" ] && git add "$dir"; done
          if ! git diff --cached --quiet; then
            git commit -m 'Generate Orleans cathedral audio'
            git push
          fi
