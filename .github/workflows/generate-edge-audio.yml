name: Benchmark French Edge voices

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/benchmark-francais-difficile.txt'
      - '.github/workflows/generate-edge-audio.yml'

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install edge-tts
        run: python -m pip install --disable-pip-version-check 'edge-tts==7.2.8'

      - name: Generate pronunciation benchmark
        id: synth
        continue-on-error: true
        run: |
          mkdir -p audio/benchmark
          python - <<'PY'
          import asyncio
          import json
          import pathlib
          import edge_tts

          TARGETS = [
              'fr-FR-RemyMultilingualNeural',
              'fr-FR-VivienneMultilingualNeural',
              'fr-FR-HenriNeural',
              'fr-FR-DeniseNeural',
              'fr-FR-EloiseNeural',
          ]

          def slug(name: str) -> str:
              return name.removeprefix('fr-FR-').removesuffix('Neural').replace('Multilingual', '-multilingual').lower()

          async def main():
              voices = await edge_tts.list_voices()
              by_name = {v['ShortName']: v for v in voices if v.get('Locale') == 'fr-FR'}
              selected = [name for name in TARGETS if name in by_name]
              pathlib.Path('audio/benchmark/available-fr-FR.txt').write_text(
                  '\n'.join(sorted(by_name)) + '\n', encoding='utf-8'
              )
              if not selected:
                  raise SystemExit('No targeted fr-FR voice is currently available from Edge TTS')

              text = pathlib.Path('scripts/benchmark-francais-difficile.txt').read_text(encoding='utf-8').strip()
              manifest = []
              for name in selected:
                  out = pathlib.Path('audio/benchmark') / f'edge-{slug(name)}.mp3'
                  print(f'Generating {name} -> {out}')
                  communicate = edge_tts.Communicate(text, name, rate='-4%', pitch='+0Hz')
                  await communicate.save(str(out))
                  info = by_name[name]
                  manifest.append({
                      'engine': 'Microsoft Edge TTS',
                      'voice': name,
                      'gender': info.get('Gender'),
                      'locale': info.get('Locale'),
                      'file': str(out),
                  })

              pathlib.Path('audio/benchmark/edge-manifest.json').write_text(
                  json.dumps(manifest, ensure_ascii=False, indent=2) + '\n',
                  encoding='utf-8'
              )

          asyncio.run(main())
          PY

      - name: Record benchmark diagnostic
        if: always()
        run: |
          mkdir -p audio/benchmark
          printf 'edge_tts_outcome=%s\ncommit=%s\n' '${{ steps.synth.outcome }}' '${{ github.sha }}' > audio/benchmark/status.txt

      - name: Commit benchmark results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/benchmark/
          if git diff --cached --quiet; then
            echo "Benchmark results unchanged"
          else
            git commit -m "Generate difficult French pronunciation benchmark"
            git push
          fi

      - name: Enforce successful synthesis
        if: steps.synth.outcome != 'success'
        run: exit 1
