name: Generate higher-quality French audio

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/generate-edge-audio.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install edge-tts
        run: python -m pip install --disable-pip-version-check 'edge-tts==7.2.8'

      - name: Generate French narration
        run: |
          mkdir -p audio
          python - <<'PY'
          import asyncio
          import pathlib
          import edge_tts

          async def main():
              voices = await edge_tts.list_voices()
              available = {v['ShortName'] for v in voices if v.get('Locale') == 'fr-FR'}
              preferences = [
                  'fr-FR-RemyMultilingualNeural',
                  'fr-FR-HenriNeural',
                  'fr-FR-VivienneMultilingualNeural',
                  'fr-FR-DeniseNeural',
              ]
              voice = next((name for name in preferences if name in available), None)
              if voice is None:
                  candidates = sorted(available)
                  if not candidates:
                      raise SystemExit('No fr-FR voice available from Edge TTS')
                  voice = candidates[0]
              print(f'Using voice: {voice}')
              pathlib.Path('audio/edge-voice.txt').write_text(voice + '\n', encoding='utf-8')
              text = pathlib.Path('scripts/demo-la-rochelle.txt').read_text(encoding='utf-8').strip()
              communicate = edge_tts.Communicate(text, voice, rate='-6%', pitch='-4Hz')
              await communicate.save('audio/demo-la-rochelle-edge.mp3')

          asyncio.run(main())
          PY

      - name: Commit generated comparison audio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/demo-la-rochelle-edge.mp3 audio/edge-voice.txt
          if git diff --cached --quiet; then
            echo "Audio unchanged"
          else
            git commit -m "Add higher-quality French voice comparison"
            git push
          fi
