name: Generate production audioguide

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/guides/**'
      - 'scripts/voice-palette.json'
      - 'scripts/render_audioguide.py'
      - '.github/workflows/generate-voice-lab-v2.yml'

permissions:
  contents: write

concurrency:
  group: audio-assets
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install audio dependencies
        id: install
        continue-on-error: true
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          python -m pip install --disable-pip-version-check 'edge-tts==7.2.8' 'pydub==0.25.1'

      - name: Render production audioguides
        id: production
        continue-on-error: true
        run: |
          shopt -s nullglob
          guides=(scripts/guides/*.json)
          if [ ${#guides[@]} -eq 0 ]; then
            echo 'No guide configuration found'
            exit 1
          fi
          for guide in "${guides[@]}"; do
            python scripts/render_audioguide.py "$guide"
          done

      - name: Commit output and diagnostic
        if: always()
        run: |
          mkdir -p audio/guides
          printf 'source_commit=%s\ninstall=%s\nproduction=%s\n' \
            "${{ github.sha }}" \
            "${{ steps.install.outcome }}" \
            "${{ steps.production.outcome }}" > audio/guides/production-status.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/guides/
          git commit -m 'Generate production audioguide' || exit 0
          git push

      - name: Fail if production failed
        if: steps.install.outcome != 'success' || steps.production.outcome != 'success'
        run: exit 1
