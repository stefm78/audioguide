name: Generate parametric voice labs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/voice-lab-v2.json'
      - 'scripts/voice-lab-v3.json'
      - '.github/workflows/generate-voice-lab-v2.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Edge TTS
        run: python -m pip install --disable-pip-version-check 'edge-tts==7.2.8'
      - name: Generate configured voice labs
        run: |
          python - <<'PY'
          import asyncio, json, pathlib
          import edge_tts

          LABS = [
              ('scripts/voice-lab-v2.json', 'audio/voice-lab-v2'),
              ('scripts/voice-lab-v3.json', 'audio/voice-lab-v3'),
          ]

          async def generate(config_path, output_dir):
              cfg_path = pathlib.Path(config_path)
              if not cfg_path.exists():
                  return
              out_dir = pathlib.Path(output_dir)
              out_dir.mkdir(parents=True, exist_ok=True)
              cfg = json.loads(cfg_path.read_text(encoding='utf-8'))
              manifest = []
              for sample in cfg['samples']:
                  out = out_dir / f"{sample['id']}.mp3"
                  print(config_path, sample['id'], sample['voice'], sample['rate'], sample['pitch'], sample['volume'])
                  await edge_tts.Communicate(
                      sample['text'], sample['voice'],
                      rate=sample['rate'], pitch=sample['pitch'], volume=sample['volume']
                  ).save(str(out))
                  manifest.append({**sample, 'file': str(out)})
              (out_dir / 'manifest.json').write_text(
                  json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
              )

          async def main():
              for config_path, output_dir in LABS:
                  await generate(config_path, output_dir)

          asyncio.run(main())
          PY
      - name: Commit generated samples
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/voice-lab-v2/ audio/voice-lab-v3/
          if git diff --cached --quiet; then
            echo "Voice labs unchanged"
          else
            git commit -m "Generate parametric voice labs"
            git push
          fi
