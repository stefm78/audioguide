name: Generate Orleans cathedral photos

on:
  push:
    branches:
      - main
      - feat/orleans-cathedral-photos
    paths:
      - series/orleans-cathedral/photos.json
      - scripts/render_cathedral_photos.py
      - .github/workflows/generate-orleans-cathedral-photos.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: orleans-cathedral-photos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install renderer dependencies
        run: pip install --disable-pip-version-check requests==2.32.5 pillow==11.3.0
      - name: Download and optimize Wikimedia Commons photos
        run: python scripts/render_cathedral_photos.py
      - name: Validate photo outputs
        run: |
          python - <<'PY'
          import json, pathlib
          root=pathlib.Path('series/orleans-cathedral')
          cfg=json.loads((root/'photos.json').read_text())
          status=json.loads((root/'photo-render-status.json').read_text())
          assert status['render']=='success'
          assert status['count']==len(cfg['photos'])==7
          for p in cfg['photos']:
              f=root/p['target']
              assert f.exists() and f.stat().st_size > 10000, f
          print('photo validation: 7/7')
          PY
      - name: Commit optimized photos
        run: |
          if git status --porcelain -- series/orleans-cathedral/assets/photos series/orleans-cathedral/photo-render-status.json | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- series/orleans-cathedral/assets/photos series/orleans-cathedral/photo-render-status.json
            git commit -m "Generate Orleans cathedral photos"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "No photo changes to commit"
          fi
