name: Generate parametric voice lab v3

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/voice-lab-v3.json'
      - '.github/workflows/generate-voice-lab-v3.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Edge TTS
        run: python -m pip install --disable-pip-version-check 'edge-tts==7.2.8'
      - name: Generate samples
        run: |
          mkdir -p audio/voice-lab-v3
          python - <<'PY'
          import asyncio, json, pathlib
          import edge_tts

          cfg = json.loads(pathlib.Path('scripts/voice-lab-v3.json').read_text(encoding='utf-8'))

          async def main():
              manifest=[]
              for sample in cfg['samples']:
                  out = pathlib.Path('audio/voice-lab-v3') / f"{sample['id']}.mp3"
                  print(sample['id'], sample['voice'], sample['rate'], sample['pitch'], sample['volume'])
                  await edge_tts.Communicate(
                      sample['text'], sample['voice'],
                      rate=sample['rate'], pitch=sample['pitch'], volume=sample['volume']
                  ).save(str(out))
                  manifest.append({**sample, 'file': str(out)})
              pathlib.Path('audio/voice-lab-v3/manifest.json').write_text(
                  json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
              )

          asyncio.run(main())
          PY
      - name: Commit generated samples
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/voice-lab-v3/
          if git diff --cached --quiet; then
            echo "Voice lab unchanged"
          else
            git commit -m "Generate parametric voice lab v3"
            git push
          fi
