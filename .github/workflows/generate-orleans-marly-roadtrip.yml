name: Generate Orleans to Marly roadtrip audio

on:
  pull_request:
    paths:
      - 'series/orleans-marly-roadtrip/**'
      - 'scripts/voice-palette.json'
      - 'scripts/render_audioguide.py'
      - 'scripts/render_audioguide_fr.py'
      - '.github/workflows/generate-orleans-marly-roadtrip.yml'
  push:
    branches: [main]
    paths:
      - 'series/orleans-marly-roadtrip/**'
      - 'scripts/voice-palette.json'
      - 'scripts/render_audioguide.py'
      - 'scripts/render_audioguide_fr.py'
      - '.github/workflows/generate-orleans-marly-roadtrip.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: orleans-marly-roadtrip-audio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    strategy:
      fail-fast: false
      matrix:
        guide:
          - orleans-marly-ep01
          - orleans-marly-ep02
          - orleans-marly-ep03
          - orleans-marly-ep04
          - orleans-marly-ep05
          - orleans-marly-ep06
          - orleans-marly-ep07
          - orleans-marly-g01
          - orleans-marly-m01
          - orleans-marly-g02
          - orleans-marly-m02
          - orleans-marly-g03
          - orleans-marly-m03
          - orleans-marly-g04
          - orleans-marly-m04
          - orleans-marly-g05
          - orleans-marly-g06
          - orleans-marly-m05
          - orleans-marly-g07
          - orleans-marly-m06
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install audio dependencies
        run: python -m pip install --disable-pip-version-check 'edge-tts==7.2.8' 'imageio-ffmpeg==0.6.0'

      - name: Extract guide from production sources
        shell: bash
        run: |
          set -euo pipefail
          python - "${{ matrix.guide }}" <<'PY'
          import json, pathlib, re, sys
          guide_id = sys.argv[1]
          base = pathlib.Path('series/orleans-marly-roadtrip')
          manifest = json.loads((base / 'longform/manifest.json').read_text(encoding='utf-8'))
          legacy = json.loads((base / 'series.json').read_text(encoding='utf-8'))
          episodes = []
          for rel in manifest['episode_files']:
              item = json.loads((base / rel).read_text(encoding='utf-8'))
              supplement = base / manifest['supplement_dir'] / f"ep{int(item['episode']):02d}.json"
              if supplement.exists():
                  extra = json.loads(supplement.read_text(encoding='utf-8'))
                  assert extra['episode_id'] == item['id'], (supplement, extra.get('episode_id'), item['id'])
                  item['segments'] = item['segments'][:-1] + extra.get('segments', []) + item['segments'][-1:]
                  item['sources'] = list(dict.fromkeys(item.get('sources', []) + extra.get('sources', [])))
              episodes.append(item)
          items = {x['id']: x for x in episodes + legacy.get('capsules', [])}
          item = items[guide_id]
          if guide_id.startswith('orleans-marly-ep'):
              words = sum(len(re.findall(r"\b[\wÀ-ÿ'-]+\b", s['text'])) for s in item['segments'])
              assert words >= manifest['quality_gates']['main_episode_min_words'], (guide_id, words)
              visual = item.get('visual_reference') or {}
              assert visual.get('image_url', '').startswith('https://commons.wikimedia.org/'), guide_id
              assert visual.get('source_page', '').startswith('https://commons.wikimedia.org/'), guide_id
              assert visual.get('license'), guide_id
              print(f'{guide_id}: {words} words; visual={visual.get("title")}')
          payload = {
              'id': guide_id,
              'production_version': manifest['production_version'],
              'title': item['title'],
              'series': manifest['series'],
              'episode': item.get('episode'),
              'location': item.get('location', 'Orléans → Marly-le-Roi, France'),
              'historical_note': item.get('historical_note'),
              'lead_in_ms': manifest.get('lead_in_ms', 450),
              'sources': item.get('sources', []),
              'segments': item['segments'],
          }
          pathlib.Path('guide.json').write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Render guide in French and validate real duration
        shell: bash
        run: |
          set -euo pipefail
          out="audio/guides/${{ matrix.guide }}"
          rendered=false
          for attempt in 1 2 3; do
            rm -rf "$out"
            echo "Render attempt ${attempt}/3 for ${{ matrix.guide }}"
            if timeout 1080s python scripts/render_audioguide_fr.py guide.json > render.log 2>&1; then
              rendered=true
              break
            fi
            cat render.log
            if [ "$attempt" -lt 3 ]; then sleep 4; fi
          done
          if [ "$rendered" != true ]; then
            cat render.log
            exit 1
          fi
          cat render.log
          test -s "$out/guide.mp3"
          test -s "$out/resolved-cast.json"
          python - "$out/resolved-cast.json" "$out/guide.mp3" "${{ matrix.guide }}" <<'PY'
          import json, pathlib, re, subprocess, sys
          import imageio_ffmpeg
          cast_path, mp3_path, guide_id = map(pathlib.Path, sys.argv[1:])
          data = json.loads(cast_path.read_text(encoding='utf-8'))
          assert data['segments'], 'No rendered segments'
          for segment in data['segments']:
              assert 'fr-FR' in segment['voice'], f"Non-French voice: {segment['voice']}"
              assert segment['text'].strip(), 'Empty segment'
          ffmpeg = imageio_ffmpeg.get_ffmpeg_exe()
          proc = subprocess.run([ffmpeg, '-hide_banner', '-i', str(mp3_path), '-f', 'null', '-'], text=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE)
          match = re.search(r'Duration:\s*(\d+):(\d+):(\d+(?:\.\d+)?)', proc.stderr)
          assert match, proc.stderr[-2000:]
          h, m, s = match.groups()
          duration = int(h) * 3600 + int(m) * 60 + float(s)
          if str(guide_id).startswith('orleans-marly-ep'):
              manifest = json.loads(pathlib.Path('series/orleans-marly-roadtrip/longform/manifest.json').read_text(encoding='utf-8'))
              minimum = manifest['quality_gates']['main_episode_min_duration_seconds']
              assert duration >= minimum, f'{guide_id}: {duration:.2f}s < {minimum}s'
          duration_path = mp3_path.parent / 'duration.json'
          duration_path.write_text(json.dumps({'id': str(guide_id), 'duration_seconds': round(duration, 2)}, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(f'{guide_id}: duration={duration:.2f}s')
          PY
          cp render.log "$out/render.log"
          mkdir -p "bundle/${{ matrix.guide }}"
          cp "$out/guide.mp3" "$out/resolved-cast.json" "$out/render.log" "$out/duration.json" "bundle/${{ matrix.guide }}/"

      - name: Upload rendered guide
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.guide }}
          path: bundle/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: render
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Refresh main before publication
        run: git pull --rebase origin main

      - name: Download rendered guides
        uses: actions/download-artifact@v4
        with:
          pattern: orleans-marly-*
          path: audio/guides
          merge-multiple: true

      - name: Validate and publish production output
        shell: bash
        run: |
          set -euo pipefail
          mp3_count=$(find audio/guides -maxdepth 2 -type f -path '*/orleans-marly-*/guide.mp3' | wc -l | tr -d ' ')
          manifest_count=$(find audio/guides -maxdepth 2 -type f -path '*/orleans-marly-*/resolved-cast.json' | wc -l | tr -d ' ')
          duration_count=$(find audio/guides -maxdepth 2 -type f -path '*/orleans-marly-*/duration.json' | wc -l | tr -d ' ')
          french_count=$(grep -RIl '"voice": "fr-FR-' audio/guides/orleans-marly-*/resolved-cast.json | wc -l | tr -d ' ')
          production_version=$(python -c "import json; print(json.load(open('series/orleans-marly-roadtrip/longform/manifest.json'))['production_version'])")
          test "$production_version" = "3"
          test "$mp3_count" = "20"
          test "$manifest_count" = "20"
          test "$duration_count" = "20"
          test "$french_count" = "20"
          python - <<'PY'
          import json, pathlib
          base = pathlib.Path('audio/guides')
          manifest = json.loads(pathlib.Path('series/orleans-marly-roadtrip/longform/manifest.json').read_text(encoding='utf-8'))
          minimum = manifest['quality_gates']['main_episode_min_duration_seconds']
          durations = {}
          for path in sorted(base.glob('orleans-marly-*/duration.json')):
              data = json.loads(path.read_text(encoding='utf-8'))
              durations[data['id']] = data['duration_seconds']
          mains = {k: v for k, v in durations.items() if k.startswith('orleans-marly-ep')}
          assert len(mains) == 7, mains
          assert all(v >= minimum for v in mains.values()), mains
          total = round(sum(mains.values()), 2)
          payload = {
              'production_version': manifest['production_version'],
              'editorial_model': manifest['editorial_model'],
              'minimum_main_duration_seconds': minimum,
              'main_total_duration_seconds': total,
              'guides': durations,
          }
          (base / 'orleans-marly-durations.json').write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(payload, ensure_ascii=False))
          PY
          printf 'source_commit=%s\nproduction_version=%s\neditorial_model=longform-duration-validated\nrender=success\nmp3_count=%s\nmanifest_count=%s\nduration_manifest_count=%s\nfrench_manifest_count=%s\nmain_min_duration_seconds=540\nlocale_guard=fr-FR\n' "${{ github.sha }}" "$production_version" "$mp3_count" "$manifest_count" "$duration_count" "$french_count" > audio/guides/orleans-marly-roadtrip-status.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/guides/orleans-marly-roadtrip-status.txt audio/guides/orleans-marly-durations.json
          for dir in audio/guides/orleans-marly-*; do [ -e "$dir" ] && git add "$dir"; done
          if ! git diff --cached --quiet; then
            git commit -m 'Generate duration-validated Orleans to Marly audio'
            git push
          fi
