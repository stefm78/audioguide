name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        id: configure
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        id: upload
        continue-on-error: true
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Record deployment diagnostic
        if: always()
        run: |
          printf 'checked_at=%s\nconfigure=%s\nupload=%s\ndeploy=%s\nurl=%s\n' \
            "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            "${{ steps.configure.outcome }}" \
            "${{ steps.upload.outcome }}" \
            "${{ steps.deployment.outcome }}" \
            "${{ steps.deployment.outputs.page_url }}" > .pages-status
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .pages-status
          git commit -m "Record GitHub Pages deployment diagnostic" || exit 0
          git push

      - name: Fail if Pages deployment failed
        if: steps.configure.outcome != 'success' || steps.upload.outcome != 'success' || steps.deployment.outcome != 'success'
        run: exit 1
