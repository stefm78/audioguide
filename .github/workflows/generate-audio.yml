name: Generate free French audio

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**/*.txt'
      - '.github/workflows/generate-audio.yml'

permissions:
  contents: write
  actions: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Piper
        run: python -m pip install --disable-pip-version-check 'piper-tts==1.6.0'

      - name: Download French voice
        run: |
          mkdir -p voices audio
          python -m piper.download_voices fr_FR-siwis-medium --data-dir voices

      - name: Generate French narration
        run: |
          python -m piper \
            -m voices/fr_FR-siwis-medium.onnx \
            -f audio/demo-la-rochelle.wav \
            -- "$(cat scripts/demo-la-rochelle.txt)"

      - name: Convert to MP3
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -y -loglevel error \
            -i audio/demo-la-rochelle.wav \
            -codec:a libmp3lame -q:a 2 \
            audio/demo-la-rochelle.mp3
          rm audio/demo-la-rochelle.wav

      - name: Commit generated audio
        id: commit_audio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/demo-la-rochelle.mp3
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Generate French audioguide with Piper"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish updated site
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
