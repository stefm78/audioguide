name: Generate demo audio

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Generate French storyteller audio
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib
          import urllib.request

          api_key = os.environ.get("OPENAI_API_KEY")
          if not api_key:
              raise SystemExit("Missing repository secret OPENAI_API_KEY")

          text = pathlib.Path("scripts/demo-la-rochelle.txt").read_text(encoding="utf-8").strip()
          payload = {
              "model": "gpt-4o-mini-tts",
              "voice": "cedar",
              "input": text,
              "instructions": (
                  "Parle en français de France. Adopte la voix d’un excellent conteur historique : "
                  "chaleureux, cultivé, immersif et naturel. Rythme posé mais vivant. Fais de vraies respirations "
                  "entre les idées, varie légèrement l’intonation pour créer l’attente et l’émerveillement, "
                  "sans emphase théâtrale excessive. Articule clairement les noms propres et les repères historiques. "
                  "Le récit doit donner l’impression qu’un guide passionné raconte l’histoire à quelques personnes "
                  "qui se tiennent devant le monument."
              ),
              "response_format": "mp3"
          }

          request = urllib.request.Request(
              "https://api.openai.com/v1/audio/speech",
              data=json.dumps(payload, ensure_ascii=False).encode("utf-8"),
              headers={
                  "Authorization": f"Bearer {api_key}",
                  "Content-Type": "application/json"
              },
              method="POST"
          )

          pathlib.Path("audio").mkdir(exist_ok=True)
          try:
              with urllib.request.urlopen(request, timeout=120) as response:
                  pathlib.Path("audio/demo-la-rochelle.mp3").write_bytes(response.read())
          except urllib.error.HTTPError as exc:
              body = exc.read().decode("utf-8", errors="replace")
              raise SystemExit(f"OpenAI API error {exc.code}: {body}")
          PY

      - name: Commit generated audio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/demo-la-rochelle.mp3
          git diff --cached --quiet && exit 0
          git commit -m "Generate demo storyteller audio"
          git push
