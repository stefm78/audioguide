name: Generate Loire historical series

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'series/val-de-loire/episodes/*.json'
      - 'scripts/voice-palette.json'
      - 'scripts/render_audioguide.py'
      - '.github/workflows/generate-loire-series.yml'

permissions:
  contents: write

concurrency:
  group: loire-series-audio
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        episode: ['01','02','03','04','05','06','07','08']
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install audio dependencies
        run: |
          python -m pip install --disable-pip-version-check 'edge-tts==7.2.8' 'imageio-ffmpeg==0.6.0'

      - name: Render episode
        shell: bash
        run: |
          set -euo pipefail
          ep="${{ matrix.episode }}"
          guide="series/val-de-loire/episodes/val-de-loire-ep${ep}.json"
          timeout 720s python scripts/render_audioguide.py "$guide" > "render-${ep}.log" 2>&1
          cat "render-${ep}.log"
          out="audio/guides/val-de-loire-ep${ep}"
          test -s "$out/guide.mp3"
          test -s "$out/resolved-cast.json"
          cp "render-${ep}.log" "$out/render.log"
          mkdir -p "bundle/val-de-loire-ep${ep}"
          cp "$out/guide.mp3" "$out/resolved-cast.json" "$out/render.log" "bundle/val-de-loire-ep${ep}/"

      - name: Upload rendered episode
        uses: actions/upload-artifact@v4
        with:
          name: loire-${{ matrix.episode }}
          path: bundle/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: render
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Refresh main before publication
        run: git pull --rebase origin main

      - name: Download rendered episodes
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: loire-*
          path: audio/guides
          merge-multiple: true

      - name: Validate and commit production output
        if: always()
        shell: bash
        run: |
          set -u
          mp3_count=$(find audio/guides -maxdepth 2 -type f -path '*/val-de-loire-ep*/guide.mp3' 2>/dev/null | wc -l | tr -d ' ')
          manifest_count=$(find audio/guides -maxdepth 2 -type f -path '*/val-de-loire-ep*/resolved-cast.json' 2>/dev/null | wc -l | tr -d ' ')
          if [ "$mp3_count" = "8" ] && [ "$manifest_count" = "8" ]; then
            result=success
          else
            result=failure
          fi
          printf 'source_commit=%s\nrender=%s\nmp3_count=%s\nmanifest_count=%s\n' \
            "${{ github.sha }}" "$result" "$mp3_count" "$manifest_count" > audio/guides/loire-series-status.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/guides/loire-series-status.txt
          for dir in audio/guides/val-de-loire-*; do
            [ -e "$dir" ] && git add "$dir"
          done
          if ! git diff --cached --quiet; then
            git commit -m 'Generate Loire series audio'
            git push
          fi
          test "$result" = success
