<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200"><defs><style>.bg{fill:#fbf7ed}.navy{fill:#0d3652}.gold{fill:#c99724}.line{stroke:#c99724;stroke-width:3;fill:none}.thin{stroke:#c7c4b8;stroke-width:2;fill:none}.title{font:700 48px Georgia,serif;fill:#0d3652}.sub{font:600 22px system-ui,sans-serif;fill:#84601a}.h{font:700 27px Georgia,serif;fill:#0d3652}.p{font:18px Georgia,serif;fill:#28363a}.small{font:600 15px system-ui,sans-serif;fill:#63737a}.n{font:900 20px system-ui,sans-serif;fill:white}.num{fill:#0d3652;stroke:#c99724;stroke-width:4}</style></defs><rect class="bg" width="900" height="1200"/><rect x="28" y="28" width="844" height="1144" rx="24" class="thin"/><text x="450" y="105" text-anchor="middle" class="title">Premières étapes</text><text x="450" y="150" text-anchor="middle" class="sub">de la façade au cœur du drame de 1568</text><path class="line" d="M330 180H570"/><text x="450" y="225" text-anchor="middle" class="p">On commence dehors, puis on avance lentement :</text><text x="450" y="254" text-anchor="middle" class="p">hauteur, lumière, Jeanne, puis les blessures du monument.</text><g transform="translate(85,300)"><rect width="730" height="165" rx="20" fill="#fff" stroke="#d5d4cb"/><circle cx="55" cy="55" r="30" class="num"/><text x="55" y="63" text-anchor="middle" class="n">1</text><text x="105" y="52" class="h">Parvis et façade</text><text x="105" y="88" class="p">Avant d’entrer : démonter l’illusion médiévale.</text><text x="105" y="120" class="small">▶ Lancer l’audio sur place · observer avant d’avancer</text></g><g transform="translate(85,505)"><rect width="730" height="165" rx="20" fill="#fff" stroke="#d5d4cb"/><circle cx="55" cy="55" r="30" class="num"/><text x="55" y="63" text-anchor="middle" class="n">2</text><text x="105" y="52" class="h">Nef</text><text x="105" y="88" class="p">Comprendre pourquoi le regard monte vers les voûtes.</text><text x="105" y="120" class="small">▶ Lancer l’audio sur place · observer avant d’avancer</text></g><g transform="translate(85,710)"><rect width="730" height="165" rx="20" fill="#fff" stroke="#d5d4cb"/><circle cx="55" cy="55" r="30" class="num"/><text x="55" y="63" text-anchor="middle" class="n">3</text><text x="105" y="52" class="h">Vitraux de Jeanne</text><text x="105" y="88" class="p">Lire un récit du XIXᵉ siècle sur une héroïne du XVᵉ.</text><text x="105" y="120" class="small">▶ Lancer l’audio sur place · observer avant d’avancer</text></g><g transform="translate(85,915)"><rect width="730" height="165" rx="20" fill="#fff" stroke="#d5d4cb"/><circle cx="55" cy="55" r="30" class="num"/><text x="55" y="63" text-anchor="middle" class="n">4</text><text x="105" y="52" class="h">Croisée du transept</text><text x="105" y="88" class="p">Voir dans les pierres la destruction de 1568 et la reconstruction.</text><text x="105" y="120" class="small">▶ Lancer l’audio sur place · observer avant d’avancer</text></g><text x="450" y="1140" text-anchor="middle" class="small">Étapes 1–4 · Récit audioguide Sainte-Croix</text></svg>