<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" role="img" aria-labelledby="t d"><title id="t">Référence d'ergonomie mobile — Cathédrale Sainte-Croix</title><desc id="d">Maquette vectorielle mobile-first utilisée comme référence de mise en page pour l'audioguide de Sainte-Croix.</desc><defs><linearGradient id="hero" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0d3652"/><stop offset="1" stop-color="#1f6788"/></linearGradient><style>.s{font-family:system-ui,sans-serif;fill:#172328}.w{fill:#fff}.m{fill:#607078}.g{fill:#d3a12e}.b{fill:#0d3652}.card{fill:#fffdfa;stroke:#d8d9d2}.small{font-size:8px}.med{font-size:11px}.big{font-size:19px;font-weight:800}</style></defs><rect width="390" height="844" fill="#f5f0e6"/><rect width="390" height="220" fill="url(#hero)"/><text x="18" y="31" class="s w med" font-weight="700">🎧 AudioGuide Orléans</text><text x="18" y="72" class="s w" font-size="15">Cathédrale</text><text x="18" y="104" class="s w" font-size="30" font-weight="800">Sainte-Croix</text><text x="18" y="135" class="s w" font-size="30" font-weight="800">d’Orléans</text><text x="18" y="159" class="s" fill="#ffd15b" font-size="11">Parcours audio · 55–70 min</text><g transform="translate(18 175)"><rect width="108" height="31" rx="10" fill="#ffffff15" stroke="#ffffff44"/><text x="11" y="19" class="s w small">8 épisodes + 8 bonus</text><rect x="114" width="112" height="31" rx="10" fill="#ffffff15" stroke="#ffffff44"/><text x="126" y="19" class="s w small">Place Sainte-Croix</text><rect x="232" width="84" height="31" rx="10" fill="#ffffff15" stroke="#ffffff44"/><text x="247" y="19" class="s w small">Facile</text></g><g transform="translate(14 231)"><rect class="b" width="362" height="72" rx="15"/><circle cx="38" cy="36" r="22" class="g"/><text x="31" y="41" class="s b" font-size="18">▶</text><text x="72" y="27" class="s w med" font-weight="800">Lancer la visite</text><text x="72" y="45" class="s" fill="#ffd15b" font-size="10">1 · Avant d’entrer</text><text x="72