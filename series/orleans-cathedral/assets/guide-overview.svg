<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200"><defs><style>.bg{fill:#fbf7ed}.navy{fill:#0d3652}.gold{fill:#c99724}.line{stroke:#c99724;stroke-width:3;fill:none}.thin{stroke:#c7c4b8;stroke-width:2;fill:none}.title{font:700 48px Georgia,serif;fill:#0d3652}.sub{font:600 22px system-ui,sans-serif;fill:#84601a}.h{font:700 27px Georgia,serif;fill:#0d3652}.p{font:18px Georgia,serif;fill:#28363a}.small{font:600 15px system-ui,sans-serif;fill:#63737a}.n{font:900 20px system-ui,sans-serif;fill:white}.num{fill:#0d3652;stroke:#c99724;stroke-width:4}</style></defs><rect class="bg" width="900" height="1200"/><rect x="28" y="28" width="844" height="1144" rx="24" class="thin"/><text x="450" y="105" text-anchor="middle" class="title">Cathédrale Sainte-Croix</text><text x="450" y="148" text-anchor="middle" class="sub">8 étapes · un monument, plusieurs siècles</text><path class="line" d="M320 175H580"/><text x="450" y="225" text-anchor="middle" class="p">Après les Tourelles, le Martroi et la rue Jeanne-d’Arc,</text><text x="450" y="252" text-anchor="middle" class="p">voici le lieu où histoire, foi et mémoire se superposent.</text><g transform="translate(120,305)"><path class="navy" opacity=".9" d="M70 345V70h70v275h55V125h55v220h55V125h55v220h70V70h70v275h45V410H25v-65z"/><circle cx="282" cy="235" r="56" fill="#fbf7ed"/><circle cx="282" cy="235" r="43" class="gold" opacity=".8"/><circle cx="282" cy="235" r="28" fill="#fbf7ed"/><path class="gold" d="M277 70h10v-55h-10zM260 25h44v10h-44z"/></g><text x="450" y="780" text-anchor="middle" class="h">Le fil rouge</text><text x="450" y="820" text-anchor="middle" class="p">La cathédrale que Jeanne a connue en 1429</text><text x="450" y="850" text-anchor="middle" class="p">n’est pas exactement celle que nous voyons aujourd’hui.</text><g transform="translate(115 915)"><rect width="670" height="170" rx="18" fill="#fff" stroke="#d5d4cb"/><text x="32" y="45" class="h">À retenir avant d’entrer</text><text x="38" y="82" class="p">• chœur gothique commencé au XIIIᵉ siècle</text><text x="38" y="112" class="p">• destruction majeure en 1568</text><text x="38" y="142" class="p">• reconstruction relancée par Henri IV en 1601</text></g><text x="450" y="1140" text-anchor="middle" class="small">Illustration de médiation · schématique, non architecturale</text></svg>