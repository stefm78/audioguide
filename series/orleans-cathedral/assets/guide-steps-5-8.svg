<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200"><defs><style>.bg{fill:#fbf7ed}.navy{fill:#0d3652}.gold{fill:#c99724}.line{stroke:#c99724;stroke-width:3;fill:none}.thin{stroke:#c7c4b8;stroke-width:2;fill:none}.title{font:700 48px Georgia,serif;fill:#0d3652}.sub{font:600 22px system-ui,sans-serif;fill:#84601a}.h{font:700 27px Georgia,serif;fill:#0d3652}.p{font:18px Georgia,serif;fill:#28363a}.small{font:600 15px system-ui,sans-serif;fill:#63737a}.n{font:900 20px system-ui,sans-serif;fill:white}.num{fill:#0d3652;stroke:#c99724;stroke-width:4}</style></defs><rect class="bg" width="900" height="1200"/><rect x="28" y="28" width="844" height="1144" rx="24" class="thin"/><text x="450" y="105" text-anchor="middle" class="title">Le cœur de la visite</text><text x="450" y="150" text-anchor="middle" class="sub">chœur, chapelles, Jeanne et grand orgue</text><path class="line" d="M330 180H570"/><text x="450" y="225" text-anchor="middle" class="p">À partir du chœur, la visite devient plus intime.</text><text x="450" y="254" text-anchor="middle" class="p">On ralentit, on contourne, puis on revient vers la grande nef.</text><g transform="translate(85,300)"><rect width="730" height="165" rx="20" fill="#fff" stroke="#d5d4cb"/><circle cx="55" cy="55" r="30" class="num"/><text x="55" y="63" text-anchor="middle" class="n">5</text><text x="105" y="52" class="h">Chœur et boiseries</text><text x="105" y="88" class="p">Comprendre la cathédrale comme lieu d’offices et de prière.</text><text x="105" y="120" class="small">▶ Lancer l’audio sur place · prendre le temps de regarder</text></g><g transform="translate(85,505)"><rect width="730" height="165" rx="20" fill="#fff" stroke="#d5d4cb"/><circle cx="55" cy="55" r="30" class="num"/><text x="55" y="63" text-anchor="middle" class="n">6</text><text x="105" y="52" class="h">Déambulatoire</text><text x="105" y="88" class="p">Contourner le chœur et lire quinze chapelles de plusieurs époques.</text><text x="105" y="120" class="small">▶ Lancer l’audio sur place · prendre le temps de regarder</text></g><g transform="translate(85,710)"><rect width="730" height="165" rx="20" fill="#fff" stroke="#d5d4cb"/><circle cx="55" cy="55" r="30" class="num"/><text x="55" y="63" text-anchor="middle" class="n">7</text><text x="105" y="52" class="h">Chapelle Jeanne</text><text x="105" y="88" class="p">Passer de Jeanne historique à Jeanne canonisée et honorée.</text><text x="105" y="120" class="small">▶ Lancer l’audio sur place · prendre le temps de regarder</text></g><g transform="translate(85,915)"><rect width="730" height="165" rx="20" fill="#fff" stroke="#d5d4cb"/><circle cx="55" cy="55" r="30" class="num"/><text x="55" y="63" text-anchor="middle" class="n">8</text><text x="105" y="52" class="h">Grand orgue et sortie</text><text x="105" y="88" class="p">Recomposer tout le monument d’un regard avant de revenir à Orléans.</text><text x="105" y="120" class="small">▶ Lancer l’audio sur place · prendre le temps de regarder</text></g><text x="450" y="1140" text-anchor="middle" class="small">Étapes 5–8 · Récit audioguide Sainte-Croix</text></svg>